[project]
name = "anu-pandc"
version = "0.1.0"
description = "Scrape ANU Programs & Courses: programs, majors/minors/specialisations, courses, class summaries and the course catalogue, as Markdown, JSON or CSV."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Charles Martin", email = "cpm@charlesmartin.au" }]
keywords = ["anu", "curriculum", "scraper", "programs-and-courses"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "click>=8.1",
  "rich>=13.0",
]

[project.urls]
Repository = "https://gitlab.anu.edu.au/u4110680/anu-pandc"

[project.scripts]
anu-pandc = "anu_pandc.cli:cli"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anu_pandc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
