[project]
name = "anu-pandc"
version = "0.2.0"
description = "A command-line interface to ANU curriculum data: Programs & Courses, the Policy Library, University legislation, the class timetable and the university calendar, as Markdown, JSON or CSV."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Charles Martin", email = "cpm@charlesmartin.au" }]
keywords = ["anu", "curriculum", "programs-and-courses", "policy", "legislation", "timetable", "higher-education", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "click>=8.1",
  "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/smcclab/anu-pandc"
Repository = "https://github.com/smcclab/anu-pandc"
Issues = "https://github.com/smcclab/anu-pandc/issues"

[project.scripts]
anu-pandc = "anu_pandc.cli:cli"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anu_pandc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
